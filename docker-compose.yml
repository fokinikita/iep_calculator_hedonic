services:
  # Current dashboard (one baseline bundle from git).
  app:
    build: .
    image: flats-app:latest
    env_file: .env
    environment:
      APP_DATA_DIR: /app/data
    volumes:
      # bundle from `python -m flats_pipeline export-app`; read-only
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8010"
    mem_limit: 1g
    restart: unless-stopped

  # New dashboard: every model version (baseline data/ + weekly bundles/<date>/), model picker and
  # comparison. Redeployed by the hedonic_pipeline DAG after each weekly run.
  app_v2:
    build: .
    image: flats-app:v2
    env_file: .env
    environment:
      APP_DATA_DIR: /app/data
      APP_BUNDLES_DIR: /app/bundles
    volumes:
      - ./data:/app/data:ro
      - ./bundles:/app/bundles:ro
    ports:
      - "127.0.0.1:${APP_V2_PORT:-8011}:8010"
    mem_limit: 3g
    restart: unless-stopped

  # Weekly pipeline (Airflow DAG dags/hedonic_pipeline.py): docker compose run --rm pipeline <command>
  pipeline:
    build: ./pipeline
    image: hedonic-pipeline:latest
    profiles: ["pipeline"]
    env_file: .env.pipeline
    environment:
      DATA_DIR: /data
      BUNDLES_DIR: /bundles
      INBOX_DIRS: "[]"
      UPLOAD_TO_S3: "true"
      MODEL_MAX_MEMORY_GB: "0"
      POLARS_MAX_THREADS: "8"
      CATBOOST_THREADS: "8"
    volumes:
      - ./pipeline/src:/app/src:ro
      - ./pipeline_data:/data
      - ./bundles:/bundles
    mem_limit: 18g
