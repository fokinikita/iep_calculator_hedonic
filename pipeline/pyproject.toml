[project]
name = "flats-pipeline"
version = "0.1.0"
description = "Weekly collection of Moscow secondary-market listings: raw snapshots -> price history -> sold flats dataset"
authors = [{ name = "fokinikita", email = "fokinikita@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "polars (>=1.39.0,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "boto3 (>=1.35.0,<2.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "truststore (>=0.10.0)",
]

[project.optional-dependencies]
modeling = [
    "catboost (>=1.2.10)",
    "shapely (>=2.1)",
    "scikit-learn (>=1.6)",
    "numpy (>=2.0)",
    "pandas (>=2.2)",
    "attrs (>=25.0)",
    "xlsxwriter (>=3.2)",
    "matplotlib (>=3.10)",
    "ipykernel (>=6.29)",
]

[project.scripts]
flats-pipeline = "flats_pipeline.__main__:main"

[tool.poetry]
packages = [{ include = "flats_pipeline", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.15"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
